# ==============================================
# CONFIGURAES DE DESENVOLVIMENTO - POSTGRESQL LOCAL
# ==============================================

# Configurações do servidor
server.port=8080
server.servlet.context-path=/gestao-cartoes

# ==============================================
# CONFIGURAES DO BANCO DE DADOS POSTGRESQL
# ==============================================
# Configuração para PostgreSQL local (desenvolvimento)
spring.datasource.url=jdbc:postgresql://localhost:5432/gestao_cartoes
spring.datasource.username=postgres
spring.datasource.password=postgres123
spring.datasource.driver-class-name=org.postgresql.Driver

# Configurações de pool de conexões para desenvolvimento
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.connection-timeout=20000
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.max-lifetime=1200000

# ==============================================
# CONFIGURAES JPA/HIBERNATE
# ==============================================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.jdbc.lob.non_contextual_creation=true

# ==============================================
# CONFIGURAES JACKSON (DATAS)
# ==============================================
spring.jackson.date-format=yyyy-MM-dd
spring.jackson.time-zone=America/Sao_Paulo

# ==============================================
# CONFIGURAES DE LOGGING
# ==============================================
logging.level.com.empresa.gestao_cartoes=DEBUG
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE
logging.file.name=logs/gestao-cartoes-dev.log

# ==============================================
# CONFIGURAES DE SEGURANÇA (RELAXADAS PARA DEV)
# ==============================================
# Configurações de segurança para desenvolvimento
spring.security.user.name=dev
spring.security.user.password=dev123
spring.security.user.roles=USER,ADMIN

# ==============================================
# CONFIGURAES DE MONITORAMENTO
# ==============================================
# Actuator para desenvolvimento
management.endpoints.web.exposure.include=*
management.endpoint.health.show-details=always
management.info.env.enabled=true
