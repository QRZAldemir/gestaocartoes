# ==============================================
# CONFIGURAÇÕES DO SERVIDOR
# ==============================================
server.port=8080
server.servlet.context-path=/gestao-cartoes

# ==============================================
# CONFIGURAÇÕES DO BANCO DE DADOS
# ==============================================
spring.datasource.url=jdbc:postgresql://192.168.100.10:5432/postgres
spring.datasource.username=postgres
spring.datasource.password=Qrz#89dc
spring.datasource.driver-class-name=org.postgresql.Driver

# Configurações de pool de conexões
spring.datasource.hikari.maximum-pool-size=20
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=1800000

# ==============================================
# CONFIGURAÇÕES JPA/HIBERNATE
# ==============================================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.jdbc.lob.non_contextual_creation=true

# ==============================================
# CONFIGURAÇÕES JACKSON (DATAS)
# ==============================================
spring.jackson.date-format=yyyy-MM-dd
spring.jackson.time-zone=America/Sao_Paulo

# ==============================================
# CONFIGURAÇÕES DE LOGGING
# ==============================================
logging.level.com.empresa.gestao_cartoes=DEBUG
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE
logging.file.name=logs/gestao-cartoes.log