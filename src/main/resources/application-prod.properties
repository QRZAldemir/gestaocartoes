# ==============================================
# CONFIGURAES DE PRODUÇÃO - POSTGRESQL PROXMOX
# ==============================================

# Configurações do servidor
server.port=8080
server.servlet.context-path=/gestao-cartoes

# Permitir override de beans para evitar conflitos
spring.main.allow-bean-definition-overriding=true

# ==============================================
# CONFIGURAES DO BANCO DE DADOS POSTGRESQL
# ==============================================
# Configuração para PostgreSQL no container Proxmox
spring.datasource.url=jdbc:postgresql://192.168.100.10:5432/gestao_cartoes
spring.datasource.username=postgres
spring.datasource.password=Qrz#89dc
spring.datasource.driver-class-name=org.postgresql.Driver

# Configurações de pool de conexões para produção
spring.datasource.hikari.maximum-pool-size=50
spring.datasource.hikari.minimum-idle=10
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=1800000
spring.datasource.hikari.leak-detection-threshold=60000

# ==============================================
# CONFIGURAES JPA/HIBERNATE
# ==============================================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.jdbc.lob.non_contextual_creation=true
spring.jpa.properties.hibernate.jdbc.batch_size=25
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true

# ==============================================
# CONFIGURAES JACKSON (DATAS)
# ==============================================
spring.jackson.date-format=yyyy-MM-dd
spring.jackson.time-zone=America/Sao_Paulo

# ==============================================
# CONFIGURAES DE LOGGING
# ==============================================
logging.level.com.empresa.gestao_cartoes=INFO
logging.level.org.hibernate.SQL=WARN
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=WARN
logging.file.name=logs/gestao-cartoes-prod.log
logging.pattern.file=%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n

# ==============================================
# CONFIGURAES DE SEGURANÇA
# ==============================================
# Configurações de segurança para produção
spring.security.user.name=admin
spring.security.user.password=admin123
spring.security.user.roles=ADMIN

# ==============================================
# CONFIGURAES DE MONITORAMENTO
# ==============================================
# Actuator para monitoramento
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=when-authorized
management.info.env.enabled=true
